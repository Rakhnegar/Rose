body{

.bg{

linear-gradient(

rgba(0,0,0,.25)

text-shadow:
0 0 10px rgba(255,255,255,.8),

}

#changingText{
margin-top:25px;
font-size:22px;
font-weight:500;
color:white;
min-height:60px;
opacity:1;
transition:opacity .8s ease;

text-shadow:
0 0 10px rgba(255,255,255,.3);
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
50%{
opacity:.2;
transform:scale(.5);
}
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);

}
.signature{

    left:50%;
    transform:translateX(-50%);

    font-size:10px;
    font-family:'Vazirmatn',sans-serif;

}

},500);
